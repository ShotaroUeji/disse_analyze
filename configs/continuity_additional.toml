# Continuous-angle evaluation of DISSE and ELSA.
# Paths are relative to the DELSA repository unless they start with / or ~.
output_root = "results/continuity_additional_3x3"
audio_sources = ["AudioCaps_mp3/test/107280.mp3"] # Add more clips to test source robustness.
# "single" requires one source; "mean" accepts two or more sources, evaluates
# each one, and writes their per-condition QNX(2)/Sadj means to summary_mean.csv.
audio_source_mode = "single"
distance_m = 1.5
target_t30_s = [0.0, 0.3, 0.6] # All three conditions are generated for every room.
t30_tolerance_s = 0.02 # Calibration at azimuth/elevation = 0 degrees.
calibration_max_iterations = 16

[azimuth]
start_deg = 0.0
end_deg = 360.0 # Exclusive.
step_deg = 5.0
fixed_elevation_deg = 0.0

[elevation]
min_deg = -45.0
max_deg = 45.0 # Inclusive.
step_deg = 5.0
fixed_azimuth_deg = 0.0

[[rooms]]
id = "small"
dims_m = [6.0, 5.0, 3.0]

[[rooms]]
id = "medium"
dims_m = [10.0, 7.5, 3.0]

[[rooms]]
id = "large"
dims_m = [15.0, 10.0, 3.0]

[models.disse]
enabled = true
checkpoint = "Spatial_AudioCaps/takamichi09/checkpoints_delsa_fromELSA/ckpt_sup_ep20.pt"

[models.elsa]
enabled = true
root = "~/elsa"
checkpoint = "~/elsa/Spatial_AudioCaps/takamichi09/elsa_ckck_0711/elsa_epoch_30.pt"
batch_size = 4
